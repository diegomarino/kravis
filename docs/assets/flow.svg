<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-labelledby="t d">
  <title id="t">How Kravis records connect</title>
  <desc id="d">A person takes part in an interaction. The interaction leads to a task. Tasks belong to a project or a deal, and deals have several parties.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker></defs>
  <rect width="1200" height="340" rx="20" fill="#0f172a"/>
  <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g fill="#1e293b" stroke="#38bdf8" stroke-width="2">
      <rect x="50" y="110" width="220" height="100" rx="14"/>
      <rect x="350" y="110" width="220" height="100" rx="14"/>
      <rect x="650" y="110" width="220" height="100" rx="14"/>
      <rect x="950" y="40" width="200" height="90" rx="14"/>
      <rect x="950" y="190" width="200" height="90" rx="14"/>
    </g>
    <g fill="#f8fafc" font-size="28" font-weight="700">
      <text x="160" y="154">Person</text><text x="460" y="154">Interaction</text><text x="760" y="154">Task</text>
      <text x="1050" y="92">Deal</text><text x="1050" y="242">Project</text>
    </g>
    <g fill="#94a3b8" font-size="20">
      <text x="160" y="184">or organization</text>
      <text x="460" y="184">email, meeting, call</text>
      <text x="760" y="184">follow-up, due date</text>
      <text x="1050" y="114">several parties</text>
      <text x="1050" y="264">groups the work</text>
    </g>
    <g stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#a)">
      <path d="M272 160H346"/><path d="M572 160H646"/>
      <path d="M872 140L946 100"/><path d="M872 180L946 220"/>
    </g>
    <text x="600" y="316" font-size="20" fill="#94a3b8">Every record is one JSON file. Notes can be about any of them.</text>
  </g>
</svg>
