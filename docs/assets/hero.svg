<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Kravis: a CRM for agents</title>
  <desc id="d">The word Kravis, the line "A CRM for agents. One JSON file per record.", and a terminal that records an interaction and lists the follow-up task.</desc>
  <rect width="1200" height="380" rx="20" fill="#0f172a"/>
  <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="64" y="150" font-size="84" font-weight="800" fill="#f8fafc" letter-spacing="-2">Kravis</text>
    <text x="68" y="198" font-size="28" fill="#cbd5e1">A CRM for agents.</text>
    <text x="68" y="236" font-size="24" fill="#94a3b8">One JSON file per record,</text>
    <text x="68" y="268" font-size="24" fill="#94a3b8">in a folder you own.</text>
    <rect x="68" y="296" width="150" height="6" rx="3" fill="#38bdf8"/>
  </g>
  <rect x="560" y="48" width="580" height="284" rx="14" fill="#020617" stroke="#1e293b" stroke-width="2"/>
  <circle cx="588" cy="76" r="7" fill="#f87171"/><circle cx="612" cy="76" r="7" fill="#fbbf24"/><circle cx="636" cy="76" r="7" fill="#4ade80"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20">
    <text x="588" y="126" fill="#38bdf8">$ <tspan fill="#e2e8f0">kravis interaction create \</tspan></text>
    <text x="588" y="154" fill="#e2e8f0" xml:space="preserve">    --subject "Intro call" ...</text>
    <text x="588" y="192" fill="#38bdf8">$ <tspan fill="#e2e8f0">kravis task create \</tspan></text>
    <text x="588" y="220" fill="#e2e8f0" xml:space="preserve">    --title "Send the proposal" ...</text>
    <text x="588" y="258" fill="#38bdf8">$ <tspan fill="#e2e8f0">kravis task list</tspan></text>
    <text x="588" y="298" fill="#4ade80">{"data":[{"title":"Send the proposal",</text>
  </g>
</svg>
