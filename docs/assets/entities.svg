<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" role="img" aria-labelledby="t d">
  <title id="t">The records Kravis keeps and how they relate</title>
  <desc id="d">A holder, an own organization, contains the work records it keeps: deals, projects, tasks, interactions and notes. Its users, humans and agents, work for it, and each agent works under a human handler. Beside it is the directory of people and organizations, shared and outside any holder. A person may be affiliated with any number of organizations. A deal has any number of parties, people or organizations, each with any number of party roles. A project may be tied to a deal; a task may sit in a project or a deal and may come from an interaction. An interaction has participants, people or organizations, and concerns any number of deals and projects. A note is about one or more people, organizations, deals or projects. A human may be linked to a person.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker></defs>
  <rect width="1200" height="780" rx="20" fill="#0f172a"/>
  <rect x="20" y="20" width="280" height="740" rx="18" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="410" y="20" width="770" height="740" rx="18" fill="#111c33" stroke="#38bdf8" stroke-width="2"/>
  <g stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M436 162H304"/>
    <path d="M436 317H304"/>
    <path d="M436 477H304"/>
    <path d="M436 637H304"/>
    <path d="M642 162H698"/>
    <path d="M642 317H698"/>
    <path d="M902 317H958"/>
    <path d="M540 413V383"/>
    <path d="M642 445L760 383"/>
    <path d="M642 495L1040 383"/>
    <path d="M160 260V326"/>
  </g>
  <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="160" y="56" font-size="26" font-weight="700" fill="#f8fafc">Directory</text>
    <text x="160" y="80" font-size="18" fill="#94a3b8">shared, outside any holder</text>
    <text x="795" y="56" font-size="26" font-weight="700" fill="#f8fafc">Holder</text>
    <text x="795" y="80" font-size="18" fill="#94a3b8">an own organization; it keeps these records in its name</text>
    <rect x="40" y="110" width="240" height="150" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="142" font-size="26" font-weight="700" fill="#f8fafc">People</text>
    <text x="160" y="174" font-size="18" fill="#94a3b8">affiliated with any</text>
    <text x="160" y="196" font-size="18" fill="#94a3b8">number of organizations</text>
    <rect x="40" y="330" width="240" height="150" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="362" font-size="26" font-weight="700" fill="#f8fafc">Organizations</text>
    <text x="160" y="394" font-size="18" fill="#94a3b8">an own organization</text>
    <text x="160" y="416" font-size="18" fill="#94a3b8">can be a holder</text>
    <rect x="440" y="100" width="200" height="124" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="540" y="132" font-size="26" font-weight="700" fill="#f8fafc">Humans</text>
    <text x="540" y="164" font-size="18" fill="#94a3b8">a kind of user</text>
    <text x="540" y="186" font-size="18" fill="#94a3b8">work for the holder</text>
    <rect x="700" y="100" width="200" height="124" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="800" y="132" font-size="26" font-weight="700" fill="#f8fafc">Agents</text>
    <text x="800" y="164" font-size="18" fill="#94a3b8">a kind of user</text>
    <text x="800" y="186" font-size="18" fill="#94a3b8">work under a human</text>
    <rect x="440" y="255" width="200" height="124" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="540" y="287" font-size="26" font-weight="700" fill="#f8fafc">Deal</text>
    <text x="540" y="319" font-size="18" fill="#94a3b8">any number of parties</text>
    <text x="540" y="341" font-size="18" fill="#94a3b8">with party roles</text>
    <rect x="700" y="255" width="200" height="124" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="800" y="287" font-size="26" font-weight="700" fill="#f8fafc">Project</text>
    <text x="800" y="319" font-size="18" fill="#94a3b8">may be tied to a deal</text>
    <text x="800" y="341" font-size="18" fill="#94a3b8">groups tasks</text>
    <rect x="960" y="255" width="200" height="124" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="1060" y="287" font-size="26" font-weight="700" fill="#f8fafc">Task</text>
    <text x="1060" y="319" font-size="18" fill="#94a3b8">may sit in a project</text>
    <text x="1060" y="341" font-size="18" fill="#94a3b8">or a deal; may come</text>
    <text x="1060" y="363" font-size="18" fill="#94a3b8">from an interaction</text>
    <rect x="440" y="415" width="200" height="124" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="540" y="447" font-size="26" font-weight="700" fill="#f8fafc">Interaction</text>
    <text x="540" y="479" font-size="18" fill="#94a3b8">any number of deals</text>
    <text x="540" y="501" font-size="18" fill="#94a3b8">and projects</text>
    <rect x="440" y="575" width="200" height="124" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="540" y="607" font-size="26" font-weight="700" fill="#f8fafc">Notes</text>
    <text x="540" y="639" font-size="18" fill="#94a3b8">about people,</text>
    <text x="540" y="661" font-size="18" fill="#94a3b8">organizations, deals</text>
    <text x="540" y="683" font-size="18" fill="#94a3b8">or projects</text>
    <text x="370" y="150" font-size="18" fill="#94a3b8">linked person</text>
    <text x="370" y="305" font-size="18" fill="#94a3b8">parties</text>
    <text x="370" y="465" font-size="18" fill="#94a3b8">participants</text>
    <text x="370" y="625" font-size="18" fill="#94a3b8">subjects</text>
    <text x="900" y="490" font-size="18" fill="#94a3b8">follow-up</text>
  </g>
</svg>