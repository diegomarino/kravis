    - INTERACTIONS-INV-01
    - INTERACTIONS-INV-02
    - INTERACTIONS-INV-03
    - INTERACTIONS-INV-04
    - INTERACTIONS-INV-05
    - INTERACTIONS-INV-06
    - INTERACTIONS-INV-07
    - INTERACTIONS-INV-08
    - INTERACTIONS-INV-09
    - WORK-INV-05
    - WORK-INV-06
  establishes:
    - INTERACTIONS-AC-01
    - WORKSPACE-AC-01
    - WORKSPACE-AC-02
    - WORKSPACE-AC-03
    - WORKSPACE-AC-04
    - WORKSPACE-AC-07
    - WORKSPACE-AC-08
