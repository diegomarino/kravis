schemaVersion: "1"
kind: UseCase
id: use-case:record-interaction-and-follow-up
model: model:kravis
name: Record an interaction and its follow-up
goal: An agent records an email or a meeting with its participants and source
  references, then creates the follow-up task, and can repeat either step
  safely.
