schemaVersion: "1"
kind: UseCase
id: use-case:run-a-deal
model: model:kravis
name: Run a deal
goal: A user creates a deal with its holder's party role, adds the parties and
  their party roles, moves it through its stages and closes it as won or lost
  with a lost reason.
