    - WORKSPACE-INV-05
    - WORKSPACE-INV-06
    - DEALS-INV-01
    - DEALS-INV-02
    - DEALS-INV-03
    - DEALS-INV-04
    - DEALS-INV-05
  establishes:
    - DEALS-AC-01
    - WORKSPACE-AC-13
