schemaVersion: "1"
kind: Relationship
id: rel:task-in-deal
model: model:kravis
from: concept:task
to: concept:deal
relationshipType: belongs-to
mode: record-reference
description: "A task may belong directly to a deal of its holder."
ownedBy: domain:work
constraints:
