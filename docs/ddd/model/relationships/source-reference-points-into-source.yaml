schemaVersion: "1"
kind: Relationship
id: rel:source-reference-points-into-source
model: model:kravis
from: concept:source-reference
to: concept:source
relationshipType: points-into
mode: external-reference
description: "A source reference points to one item of a source; each known source defines how its references are made canonical and which ones identify an interaction."
