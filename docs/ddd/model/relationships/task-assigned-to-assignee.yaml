schemaVersion: "1"
kind: Relationship
id: rel:task-assigned-to-assignee
model: model:kravis
from: concept:task
to: concept:assignee
relationshipType: assigned-to
mode: record-reference
description: "Every task has one human assignee and, optionally, an assigned agent working on the assignee's behalf."
ownedBy: domain:work
constraints:
  - "The assignee is a live human of the task's holder."
  - "The assigned agent's handler is the assignee."
