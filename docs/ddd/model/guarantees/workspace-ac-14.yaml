schemaVersion: "1"
kind: Guarantee
id: WORKSPACE-AC-14
model: model:kravis
ownerDomain: domain:workspace
classification: acceptance-criterion
statement: By default, searching a text returns the live records of the actor's
  holder, or of every holder when no actor is declared, and the shared
  directory (other holders with --all-holders, not-live records with --all) in
  which every word of the text appears, as a substring
  and ignoring case and accents, in the record's own text (names, emails,
  domains, subjects, summaries, titles, descriptions, note text), newest update
  first, each hit with the matching field and an excerpt.
status: active
