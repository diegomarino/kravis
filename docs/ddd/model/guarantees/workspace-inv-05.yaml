schemaVersion: "1"
kind: Guarantee
id: WORKSPACE-INV-05
model: model:kravis
ownerDomain: domain:workspace
classification: invariant
statement: A catalog-valued field only accepts values from the catalog that
  applies to the record's holder. A value removed from the catalog stays on
  existing records, check reports it, and the next edit of the record must
  replace it.
status: active
