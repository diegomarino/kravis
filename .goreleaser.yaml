version: 2

project_name: kravis

builds:
  - id: kravis
    main: ./cmd/kravis
    binary: kravis
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # {{ .Version }} has no leading v, the form `kravis --version` prints.
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

# The release notes come from release-please, which creates the release;
# goreleaser only adds the archives and checksums to it.
changelog:
  disable: true

release:
  mode: keep-existing
