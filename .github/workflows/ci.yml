name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled and unlabeled rerun the spec gate when spec-approved changes
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  DDDUCK_VERSION: 0.5.0

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.59.0
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Test
        run: just test
      - name: Skill installs
        if: matrix.os == 'ubuntu-latest'
        run: SKILL_INSTALL_TEST=1 go test ./cmd/kravis -run TestSkillInstalls -count=1
      - name: Build
        run: just build
      - name: Vulnerabilities
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} && govulncheck ./...
      - name: Model
        run: npm install --global ddduck@${DDDUCK_VERSION} &&ddduck check --root docs/ddd

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].{0,71}$'
          status=0
          while IFS= read -r subject; do
            case "$subject" in
              Merge\ *|Revert\ *|fixup!\ *|squash!\ *) continue ;;
            esac
            if [ "${#subject}" -gt 72 ] || ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "::error::not a Conventional Commit subject: $subject"
              status=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")
          exit $status

  spec-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - run: npm install --global ddduck@${DDDUCK_VERSION}
      - name: Spec gate
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'spec-approved') }}
        run: |
          # The checkout is the merge commit: its first parent is the base it merges into.
          BASE=$(git rev-parse HEAD^1)
          flag=""
          if [ "$APPROVED" = "true" ]; then flag="--approved"; fi
          go run ./cmd/specgate --base "$BASE" $flag
