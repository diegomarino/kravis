name: release

# release-please keeps a release PR with the next version and its changelog.
# Merging that PR creates the tag and the GitHub release; this workflow then
# builds the binaries and uploads them to that release. A tag made with
# GITHUB_TOKEN starts no other workflow, so the build lives here.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  GORELEASER_VERSION: v2.20.3

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PR made with GITHUB_TOKEN starts no checks; set RELEASE_PLEASE_TOKEN
          # (a PAT or app token) so the release PR runs ci.yml.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A separate job, so "Re-run failed jobs" retries a failed build or upload
  # without running release-please again (it only reports a release once).
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
